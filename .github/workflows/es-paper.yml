# Fake-money paper trading on live Kalshi esports match markets.
#
# GitHub starts this repo's scheduled runs only a few times a day, hours apart, so each run
# stays open for up to 5.5 hours and does a pass every 5 minutes: settle finished bets, pick
# up new results, and decide once on every match starting in the next 10-70 minutes (3 hours
# after a gap). State is saved as it goes. The 15-minute schedule keeps a next run queued; it
# waits for the current one (concurrency group) and takes over when it ends. GitHub's scheduler
# sometimes starts nothing for many hours (none from 09:40 to 19:00 UTC on Oct 12 2026), so a run
# that finished its full stretch also queues its successor itself.
# Kalshi is only read through its public market-data API; nothing here can place an order
# and no API key is used. Results: state/reports/summary.md on the paper-trading branch.
name: Paper trading

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run keeps going, in minutes (at most 330)"
        required: false
        default: "330"

permissions:
  contents: write
  actions: write      # lets a finished run queue the next one

concurrency:
  group: es-paper
  cancel-in-progress: false

env:
  PAPER_UNTIL: "2026-11-15"   # last day new paper bets are placed; settling continues after
  CHAIN_UNTIL: "2026-11-18"   # runs queue their own successor until this day (then the schedule alone)

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -q .
      - run: bash scripts/state_branch.sh checkout
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Paper passes every 5 minutes
        env:
          MINUTES: ${{ github.event.inputs.minutes || '330' }}
        run: |
          python -m esalpha paper-loop --state state-branch/state --until "$PAPER_UNTIL" \
            --minutes "$MINUTES" --every 5 --commit-cmd "bash scripts/state_branch.sh commit"
      - name: Save state
        if: always()
        run: |
          bash scripts/state_branch.sh commit "paper run ${{ github.run_id }}"
      - name: Queue the next run
        # only after a full stretch (a run that fails or stops early does not start a chain of
        # failing runs; the schedule picks up from there)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          if [ "$elapsed" -ge 3600 ] && [[ "$(date -u +%F)" < "$CHAIN_UNTIL" ]]; then
            gh workflow run es-paper.yml --ref "$GITHUB_REF_NAME" -f minutes=330 || echo "could not queue the next run"
          else
            echo "not queuing a successor (ran ${elapsed}s)"
          fi
