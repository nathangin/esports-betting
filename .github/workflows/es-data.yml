# Data jobs: history download, the walk-forward backtest (which also refits the parameters
# the paper trader uses) and the endpoint probe. Results go to the paper-trading branch.
#
# Scheduled: daily history refresh; on Mondays also the backtest.
# By hand: Actions tab -> Data jobs -> Run workflow, or push a commit to the esalpha branch
# whose message contains [coverage], [probe], [history], [backtest] or [paper].
name: Data jobs

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      tasks:
        description: "Space-separated: coverage probe history sides backtest paper"
        required: true
        default: "history backtest"
      args:
        description: "Extra arguments for the history task (e.g. --days 150)"
        required: false
        default: ""
  push:
    branches: [esalpha]

permissions:
  contents: write

concurrency:
  group: es-data
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[probe]') ||
      contains(github.event.head_commit.message, '[history]') ||
      contains(github.event.head_commit.message, '[backtest]') ||
      contains(github.event.head_commit.message, '[paper]') ||
      contains(github.event.head_commit.message, '[coverage]') ||
      contains(github.event.head_commit.message, '[sides]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -q .
      - run: bash scripts/state_branch.sh checkout
      - name: Pick tasks
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          INPUT_TASKS: ${{ github.event.inputs.tasks }}
          INPUT_ARGS: ${{ github.event.inputs.args }}
        run: |
          tasks="$INPUT_TASKS"
          args="$INPUT_ARGS"
          if [ "$EVENT" = "schedule" ]; then
            tasks="history"
            args="--days 14 --minutes 40"
            if [ "$(date -u +%u)" = "1" ]; then tasks="history backtest"; fi
          elif [ -z "$tasks" ]; then
            for t in coverage probe history sides backtest paper; do
              case "$MSG" in *"[$t]"*) tasks="$tasks $t";; esac
            done
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Tasks: $tasks / history args: $args"
      - name: Run tasks
        env:
          TASKS: ${{ steps.pick.outputs.tasks }}
          HISTORY_ARGS: ${{ steps.pick.outputs.args }}
        run: |
          mkdir -p state-branch/state/logs
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          for t in $TASKS; do
            log="state-branch/state/logs/${t}-${ts}.log"
            case "$t" in
              probe)    python -m esalpha probe --out state-branch/state/probe 2>&1 | tee -a "$log" ;;
              coverage) python -m esalpha probe --kalshi-coverage --out state-branch/state/probe 2>&1 | tee -a "$log" ;;
              history)  python -m esalpha history --state state-branch/state $HISTORY_ARGS 2>&1 | tee -a "$log" ;;
              sides)    python -m esalpha sides --state state-branch/state 2>&1 | tee -a "$log" ;;
              backtest) python -m esalpha backtest --state state-branch/state 2>&1 | tee -a "$log" ;;
              paper)    python -m esalpha paper --state state-branch/state 2>&1 | tee -a "$log" ;;
              *) echo "unknown task $t" ;;
            esac
          done
      - name: Save results
        if: always()
        env:
          TASKS: ${{ steps.pick.outputs.tasks }}
        run: |
          bash scripts/state_branch.sh commit "data jobs ${TASKS} (run ${{ github.run_id }})"
