# Occasional data jobs: endpoint probe, history download and the historical (fake-money)
# backtest. Results are committed to the paper-trading branch.
#
# Run from the Actions tab (Run workflow -> pick a task), or by pushing a commit to the
# esalpha branch whose message contains [probe], [history], [backtest] or [paper].
name: Data jobs

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Space-separated: probe history backtest paper"
        required: true
        default: "history backtest"
      args:
        description: "Extra arguments for the history task (e.g. --days 150)"
        required: false
        default: ""
  push:
    branches: [esalpha]

permissions:
  contents: write

concurrency:
  group: es-state
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[probe]') ||
      contains(github.event.head_commit.message, '[history]') ||
      contains(github.event.head_commit.message, '[backtest]') ||
      contains(github.event.head_commit.message, '[paper]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -q .
      - run: bash scripts/state_branch.sh checkout
      - name: Pick tasks
        id: pick
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT_TASKS: ${{ github.event.inputs.tasks }}
        run: |
          tasks="$INPUT_TASKS"
          if [ -z "$tasks" ]; then
            for t in probe history backtest paper; do
              case "$MSG" in *"[$t]"*) tasks="$tasks $t";; esac
            done
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Tasks: $tasks"
      - name: Run tasks
        env:
          TASKS: ${{ steps.pick.outputs.tasks }}
          HISTORY_ARGS: ${{ github.event.inputs.args }}
        run: |
          mkdir -p state-branch/state/logs
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          for t in $TASKS; do
            log="state-branch/state/logs/${t}-${ts}.log"
            case "$t" in
              probe)    python -m esalpha probe --out state-branch/state/probe 2>&1 | tee -a "$log" ;;
              history)  python -m esalpha history --state state-branch/state $HISTORY_ARGS 2>&1 | tee -a "$log" ;;
              backtest) python -m esalpha backtest --state state-branch/state 2>&1 | tee -a "$log" ;;
              paper)    python -m esalpha paper --state state-branch/state 2>&1 | tee -a "$log" ;;
              *) echo "unknown task $t" ;;
            esac
          done
      - name: Save results
        if: always()
        env:
          TASKS: ${{ steps.pick.outputs.tasks }}
        run: |
          bash scripts/state_branch.sh commit "data:${TASKS} (run ${{ github.run_id }})"
